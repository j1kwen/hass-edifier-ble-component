name: Validate Setup

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate-setup:
    name: Setup and tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: requirements_test.txt

      - name: Install Home Assistant
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements_test.txt

      - name: Compile Python files
        run: python -m compileall -q custom_components/edifier_ble tests

      - name: Run unit tests
        env:
          PYTHONDONTWRITEBYTECODE: "1"
        run: python -m unittest discover -s tests -v

      - name: Validate JSON files
        run: |
          python -m json.tool custom_components/edifier_ble/manifest.json > /dev/null
          python -m json.tool custom_components/edifier_ble/strings.json > /dev/null
          python -m json.tool custom_components/edifier_ble/translations/en.json > /dev/null
          python -m json.tool custom_components/edifier_ble/translations/zh-Hans.json > /dev/null
          python -m json.tool hacs.json > /dev/null
